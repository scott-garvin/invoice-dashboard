services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: local-demo-only
    ports: ["127.0.0.1:5444:5432"]
    volumes: ["ledgerly-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly"]
      interval: 3s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ledgerly:local-demo-only@db:5432/ledgerly
      DEMO_ACCESS_KEY: local-ledgerly-demo-access-only
      PORT: 8081
      NODE_ENV: development
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  ledgerly-data:
